<!doctype html>
<html lang="ko">
<head>

<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d7dce5;--accent:#173f73;--accent2:#eef4fb;--front:#111827;--free:#f3f4f6;--shadow:0 8px 24px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif}.wrap{max-width:1320px;margin:auto;padding:16px 14px 36px}.topbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer}.btn.active{background:var(--front);color:#fff;border-color:var(--front)}.cover{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px}.cover-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.cover-title .ko{font-size:26px;font-weight:900;letter-spacing:-.02em}.cover-title .en{font-size:18px;font-weight:800;color:#374151}.cover-meta{margin-top:8px;font-size:14px;font-weight:700;color:#374151;line-height:1.6}.cover-place{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.55}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;font-size:14px}.front{background:var(--front);color:#fff;text-align:center;font-weight:900;letter-spacing:.18em;border-radius:10px;padding:9px;margin:12px 0}.hall-wrap{overflow-x:auto;padding:4px 0 10px}.hall{position:relative;min-width:1180px;height:1245px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px}.table-block{position:absolute;width:260px;height:220px}.table-core{position:absolute;left:82px;top:62px;width:96px;height:96px;border:2px solid #8e99aa;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;line-height:1.1;box-shadow:inset 0 0 0 5px #fff}.seat{position:absolute;width:78px;min-height:45px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 6px;box-shadow:0 2px 7px rgba(15,23,42,.05);font-size:9.5px;line-height:1.22;overflow-wrap:anywhere;display:flex;align-items:flex-start}.seat .n{display:inline-flex;flex:0 0 18px;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent2);color:var(--accent);font-size:10px;font-weight:800;margin-right:4px}.seat .nm{font-weight:700}.seat.match{outline:3px solid #f59e0b;z-index:3}.free-table .table-core{background:#f7f7f8;border-style:dashed;color:#4b5563;font-size:13px;padding:10px}.free-table .seat{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;background:#f6f7f9;border-color:#cfd5df}.free-table .s1,.free-table .s8{left:112px}.free-table .s2,.free-table .s4,.free-table .s6{left:26px}.free-table .s3,.free-table .s5,.free-table .s7{right:26px}.loading,.error{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;text-align:center;color:var(--muted)}.error{color:#991b1b;border-color:#fecaca;background:#fff7f7}.s1{left:91px;top:0}.s2{left:0;top:42px}.s4{left:0;top:88px}.s6{left:0;top:134px}.s8{left:91px;top:171px}.s7{right:0;top:134px}.s5{right:0;top:88px}.s3{right:0;top:42px}.t-H2{left:80px;top:70px}.t-H1{left:460px;top:70px}.t-H3{left:840px;top:70px}.t-H7{left:10px;top:345px}.t-H5{left:300px;top:345px}.t-H4{left:590px;top:345px}.t-H6{left:880px;top:345px}.t-F1{left:10px;top:660px}.t-H9{left:300px;top:660px}.t-H8{left:590px;top:660px}.t-F2{left:880px;top:660px}.t-F3{left:10px;top:965px}.t-F4{left:300px;top:965px}.t-F5{left:590px;top:965px}.t-F6{left:880px;top:965px}footer{margin-top:16px;font-size:11px;color:var(--muted);text-align:center}@media(max-width:520px){.wrap{padding:10px 8px 22px}.topbar{justify-content:stretch}.topbar .btn{flex:1}.toolbar{grid-template-columns:1fr}.cover{padding:15px}.cover-title .ko{font-size:23px}.cover-title .en{font-size:16px}.hall-wrap{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}}
</style>
</head><body><div class="wrap">
<div class="topbar"><button class="btn active" id="koBtn">한국어</button><button class="btn" id="enBtn">English</button><button class="btn" id="copyBtn">링크 복사</button></div>
<section class="cover"><div class="cover-title"><span class="ko" id="coverKo">공식 만찬</span><span class="en" id="coverEn">VIP Dinner</span></div><div class="cover-meta" id="coverMeta">2026년 9월 15일 (화) · 18:20–20:20 · 파크볼룸 2, 3 (5F)</div><div class="cover-place" id="coverPlace"><strong>콘래드 서울</strong> · 서울특별시 영등포구 국제금융로 10<br>Conrad Seoul · 10 Gukjegeumyung-ro, Yeouido, Yeongdeungpo-gu, Seoul, Korea</div></section>
<div class="toolbar"><input id="search" class="search" placeholder="이름·기관·테이블 검색"><button class="btn" id="reloadBtn">새로고침</button></div><div class="front">FRONT</div><div id="status" class="loading">좌석 정보를 불러오는 중입니다…</div><div class="hall-wrap"><main id="hall" class="hall" hidden></main></div><footer>ICAK · VIP Dinner Seating Plan</footer></div>
<script>
const SHEET_ID='1eWSY207GWW8n1YhlqX6ZWD3MjS0q_OhZCFD4qdzydhE',GID='2749233';let rows=[],lang='ko';
const ui={ko:{search:'이름·기관·테이블 검색',copy:'링크 복사',reload:'새로고침',loading:'좌석 정보를 불러오는 중입니다…',error:'좌석 정보를 불러오지 못했습니다. 새로고침해 주세요.',meta:'2026년 9월 15일 (화) · 18:20–20:20 · 파크볼룸 2, 3 (5F)',place:'<strong>콘래드 서울</strong> · 서울특별시 영등포구 국제금융로 10<br>Conrad Seoul · 10 Gukjegeumyung-ro, Yeouido, Yeongdeungpo-gu, Seoul, Korea',free:'기타 참가자<br>자유석'},en:{search:'Search name, organization or table',copy:'Copy link',reload:'Refresh',loading:'Loading seating information…',error:'Unable to load seating information. Please refresh.',meta:'Tuesday, September 15, 2026 · 18:20–20:20 · Park Ballroom 2, 3 (5F)',place:'<strong>Conrad Seoul</strong> · 10 Gukjegeumyung-ro, Yeouido, Yeongdeungpo-gu, Seoul, Korea<br>서울특별시 영등포구 국제금융로 10',free:'Other Guests<br>Open Seating'}};
function loadSheet(){rows=[];hall.hidden=true;status.hidden=false;status.className='loading';status.textContent=ui[lang].loading;document.getElementById('sheetLoader')?.remove();const x=document.createElement('script');x.id='sheetLoader';const tqx='out:json;responseHandler:seatDataCallback';x.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&range=A1:F100&tqx=${encodeURIComponent(tqx)}&_=${Date.now()}`;x.onerror=showError;document.body.appendChild(x);setTimeout(()=>{if(!rows.length)showError()},10000)}
window.seatDataCallback=d=>{try{const labels=d.table.cols.map(c=>(c.label||'').trim());rows=d.table.rows.map(r=>{const o={};labels.forEach((h,i)=>{if(h)o[h]=r.c[i]?(r.c[i].f??r.c[i].v??''):''});return o}).filter(r=>r['테이블']&&r['좌석번호']);render()}catch(e){showError()}};
function showError(){status.hidden=false;status.className='error';status.textContent=ui[lang].error}
function vipTable(t){const block=document.createElement('section');block.className=`table-block t-${t}`;block.innerHTML=`<div class="table-core">${t}</div>`;const q=search.value.trim().toLowerCase();for(let n=1;n<=8;n++){const r=rows.find(x=>x['테이블']===t&&Number(x['좌석번호'])===n)||{};const name=lang==='en'?(r['English']||r['표기내용']||''):(r['표기내용']||'');const hay=[t,n,r['표기내용'],r['English']].join(' ').toLowerCase();const seat=document.createElement('div');seat.className=`seat s${n}${q&&hay.includes(q)?' match':''}`;seat.innerHTML=`<span class="n">${n}</span><span class="nm">${esc(name)}</span>`;block.appendChild(seat)}return block}
function freeTable(id){const block=document.createElement('section');block.className=`table-block free-table t-${id}`;block.innerHTML=`<div class="table-core">${ui[lang].free}</div>`;for(let n=1;n<=8;n++){const s=document.createElement('div');s.className=`seat s${n}`;block.appendChild(s)}return block}
function render(){applyUi();hall.querySelectorAll('.table-block').forEach(e=>e.remove());for(const t of ['H1','H2','H3','H4','H5','H6','H7','H8','H9'])hall.appendChild(vipTable(t));for(const id of ['F1','F2','F3','F4','F5','F6'])hall.appendChild(freeTable(id));status.hidden=true;hall.hidden=false}
function applyUi(){const t=ui[lang];document.documentElement.lang=lang;search.placeholder=t.search;copyBtn.textContent=t.copy;reloadBtn.textContent=t.reload;coverMeta.textContent=t.meta;coverPlace.innerHTML=t.place;coverKo.textContent='공식 만찬';coverEn.textContent='VIP Dinner';koBtn.classList.toggle('active',lang==='ko');enBtn.classList.toggle('active',lang==='en')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
koBtn.onclick=()=>{lang='ko';render()};enBtn.onclick=()=>{lang='en';render()};search.addEventListener('input',render);reloadBtn.onclick=loadSheet;copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);const o=copyBtn.textContent;copyBtn.textContent=lang==='ko'?'복사됨':'Copied';setTimeout(()=>copyBtn.textContent=o,1200)}catch(e){prompt('Copy link',location.href)}};applyUi();loadSheet();
</script></body></html>
