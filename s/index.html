function moveFromMini(e){const r=miniStage.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left))/r.width,y=Math.max(0,Math.min(r.height,e.clientY-r.top))/r.height;hallWrap.scrollLeft=x*hallCanvas.offsetWidth-hallWrap.clientWidth/2;hallWrap.scrollTop=y*hallCanvas.offsetHeight-hallWrap.clientHeight/2}

koBtn.onclick=()=>{lang='ko';render()};enBtn.onclick=()=>{lang='en';render()};search.addEventListener('input',render);reloadBtn.onclick=loadSheet;zoomOut.onclick=()=>applyZoom(zoom-.1);zoomIn.onclick=()=>applyZoom(zoom+.1);zoomFit.onclick=fitView;copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);const o=copyBtn.textContent;copyBtn.textContent=lang==='ko'?'복사됨':'Copied';setTimeout(()=>copyBtn.textContent=o,1200)}catch(e){prompt('Copy link',location.href)}};modalClose.onclick=closeDetail;detailModal.addEventListener('click',e=>{if(e.target===detailModal)closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});hallWrap.addEventListener('scroll',updateMiniViewport,{passive:true});window.addEventListener('resize',()=>{buildMiniMap();updateMiniViewport()});miniStage.addEventListener('pointerdown',e=>{miniDragging=true;miniStage.setPointerCapture(e.pointerId);moveFromMini(e)});miniStage.addEventListener('pointermove',e=>{if(miniDragging)moveFromMini(e)});miniStage.addEventListener('pointerup',()=>miniDragging=false);miniStage.addEventListener('pointercancel',()=>miniDragging=false);applyUi();loadSheet();
</script></body></html>
