<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>좌석배치 | Seating</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#142033;--muted:#6b7280;--line:#d9dfeb;--accent:#0b5ed7;--accent2:#eaf2ff;--front:#111827;--ok:#e9f8ef;--okink:#166534;--warn:#fff4db;--warnink:#92400e;--empty:#f3f4f6;--shadow:0 8px 24px rgba(15,23,42,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:18px 14px 36px}
    header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
    h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer}.btn.active{background:var(--front);color:#fff;border-color:var(--front)}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;outline:none}.search:focus{border-color:#91b8ff;box-shadow:0 0 0 3px rgba(11,94,215,.08)}
    .front{background:var(--front);color:#fff;text-align:center;font-weight:800;letter-spacing:.16em;border-radius:12px;padding:10px;margin:12px 0 18px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .table-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
    .table-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.table-code{font-weight:900;font-size:18px}.count{font-size:12px;color:var(--muted)}
    .seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seat{border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-height:74px;background:#fff;display:flex;gap:8px;align-items:flex-start}.seat.no-match{display:none}.num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}.name{font-size:13px;font-weight:700;line-height:1.42;word-break:keep-all}.meta{font-size:11px;color:var(--muted);margin-top:3px}.seat.status-변경{background:var(--warn)}.seat.status-확인중{background:#fffbea}.seat.status-공석{background:var(--empty)}
    .loading,.error{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}.error{color:#991b1b;border-color:#fecaca;background:#fff7f7}
    footer{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}.tiny{font-size:11px;color:var(--muted)}
    @media(max-width:820px){.grid{grid-template-columns:1fr 1fr}.seats{grid-template-columns:1fr}.table-card{padding:10px}}
    @media(max-width:520px){.wrap{padding:14px 10px 28px}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}.front{margin-top:8px}h1{font-size:21px}.seat{min-height:64px}.name{font-size:14px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">좌석배치도</h1><div class="sub" id="subtitle">페이지를 열 때 Google Sheet의 최신 좌석 정보를 불러옵니다.</div></div>
    <div class="actions">
      <button class="btn active" id="koBtn" type="button">한국어</button>
      <button class="btn" id="enBtn" type="button">English</button>
      <button class="btn" id="copyBtn" type="button">링크 복사</button>
    </div>
  </header>
  <div class="toolbar"><input id="search" class="search" placeholder="이름·기관·테이블 검색" /><button class="btn" id="reloadBtn" type="button">새로고침</button></div>
  <div class="front">FRONT</div>
  <div id="status" class="loading">최신 좌석 정보를 불러오는 중입니다…</div>
  <main id="grid" class="grid" hidden></main>
  <footer><span id="refreshed"></span><br><span class="tiny">Source: Google Sheets · ICAK</span></footer>
</div>
<script>
  const SHEET_ID='11WmfuDj7FSk5LRvEB2CArVETZOA9NgpySLYscG223-E';
  const GID='600368953';
  let rows=[], lang='ko';
  const ui={
    ko:{title:'좌석배치도',subtitle:'페이지를 열 때 Google Sheet의 최신 좌석 정보를 불러옵니다.',search:'이름·기관·테이블 검색',copy:'링크 복사',reload:'새로고침',loading:'최신 좌석 정보를 불러오는 중입니다…',error:'좌석 정보를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.',updated:'불러온 시각',seat:'석'},
    en:{title:'Seating Plan',subtitle:'The latest seating data is loaded from Google Sheets whenever this page is opened.',search:'Search name, organization or table',copy:'Copy link',reload:'Refresh',loading:'Loading the latest seating data…',error:'Unable to load seating data. Please refresh shortly.',updated:'Loaded at',seat:' seats'}
  };
  const statusEn={'배정':'Assigned','변경':'Changed','확인중':'Pending','공석':'Vacant'};
  function loadSheet(){
    document.getElementById('grid').hidden=true; const s=document.getElementById('status'); s.className='loading'; s.textContent=ui[lang].loading; s.hidden=false;
    const old=document.getElementById('sheetLoader'); if(old) old.remove();
    const script=document.createElement('script'); script.id='sheetLoader';
    const tqx='out:json;responseHandler:seatDataCallback';
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&range=A1:F100&tqx=${encodeURIComponent(tqx)}&_=${Date.now()}`;
    script.onerror=()=>showError(); document.body.appendChild(script);
    setTimeout(()=>{if(!rows.length) showError();},10000);
  }
  window.seatDataCallback=function(data){
    try{
      const labels=data.table.cols.map(c=>(c.label||'').trim());
      rows=data.table.rows.map(r=>{const o={}; labels.forEach((h,i)=>{if(h)o[h]=r.c[i]?(r.c[i].f??r.c[i].v??''):''});return o}).filter(r=>r['테이블']&&r['좌석번호']);
      render();
    }catch(e){showError()}
  };
  function showError(){const s=document.getElementById('status');s.hidden=false;s.className='error';s.textContent=ui[lang].error}
  function render(){
    applyUi();
    const q=document.getElementById('search').value.trim().toLowerCase();
    const grouped={}; rows.forEach(r=>(grouped[r['테이블']]??=[]).push(r));
    const grid=document.getElementById('grid'); grid.innerHTML='';
    Object.keys(grouped).sort((a,b)=>Number(a.replace(/\D/g,''))-Number(b.replace(/\D/g,''))).forEach(table=>{
      const card=document.createElement('section'); card.className='table-card';
      const list=grouped[table].sort((a,b)=>Number(a['좌석번호'])-Number(b['좌석번호']));
      const visible=list.filter(r=>matchRow(r,q));
      if(q && !visible.length) return;
      card.innerHTML=`<div class="table-title"><div class="table-code">${esc(table)}</div><div class="count">${list.length}${lang==='ko'?'석':ui.en.seat}</div></div><div class="seats"></div>`;
      const box=card.querySelector('.seats');
      list.forEach(r=>{
        const seat=document.createElement('div'); const st=String(r['상태']||'배정'); seat.className=`seat status-${st}`; if(q&&!matchRow(r,q)) seat.classList.add('no-match');
        const name=lang==='en'?(r['English']||r['표기내용']||''):(r['표기내용']||'');
        const meta=lang==='en'?(statusEn[st]||st):st;
        seat.innerHTML=`<div class="num">${esc(r['좌석번호'])}</div><div><div class="name">${esc(name)}</div><div class="meta">${esc(meta)}${r['비고']?` · ${esc(r['비고'])}`:''}</div></div>`;
        box.appendChild(seat);
      }); grid.appendChild(card);
    });
    document.getElementById('status').hidden=true; grid.hidden=false;
    document.getElementById('refreshed').textContent=`${ui[lang].updated}: ${new Intl.DateTimeFormat(lang==='ko'?'ko-KR':'en-US',{dateStyle:'medium',timeStyle:'short'}).format(new Date())}`;
  }
  function matchRow(r,q){if(!q)return true; return [r['테이블'],r['좌석번호'],r['표기내용'],r['English'],r['상태'],r['비고']].some(v=>String(v||'').toLowerCase().includes(q))}
  function applyUi(){const t=ui[lang];document.documentElement.lang=lang;document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('search').placeholder=t.search;document.getElementById('copyBtn').textContent=t.copy;document.getElementById('reloadBtn').textContent=t.reload;document.getElementById('koBtn').classList.toggle('active',lang==='ko');document.getElementById('enBtn').classList.toggle('active',lang==='en')}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  document.getElementById('koBtn').onclick=()=>{lang='ko';render()}; document.getElementById('enBtn').onclick=()=>{lang='en';render()};
  document.getElementById('search').addEventListener('input',()=>render()); document.getElementById('reloadBtn').onclick=()=>{rows=[];loadSheet()};
  document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);const b=document.getElementById('copyBtn');const old=b.textContent;b.textContent=lang==='ko'?'복사됨':'Copied';setTimeout(()=>b.textContent=old,1200)}catch(e){prompt('Copy link',location.href)}};
  applyUi(); loadSheet();
</script>
</body>
</html>
