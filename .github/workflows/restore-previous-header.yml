name: Restore previous page header

on:
  push:
    branches:
      - main
    paths:
      - "scripts/restore-previous-header.mjs"
      - ".github/workflows/restore-previous-header.yml"

permissions:
  contents: write

concurrency:
  group: restore-previous-page-header
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Restore previous header styles only
        run: node scripts/restore-previous-header.mjs

      - name: Validate page assets and JavaScript
        run: |
          node scripts/validate-page-assets.mjs
          node --check assets/js/market.js
          node --check assets/js/projects.js
          node --check assets/js/project.js

      - name: Commit restored header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/market.css assets/css/projects.css assets/css/project.css
          if git diff --cached --quiet; then
            echo "Header already restored."
            exit 0
          fi
          git commit -m "Restore previous top navigation design"
          git push origin HEAD:main
