name: Sync sheet cache

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quick keeps cached rows missing from the sheet; reconcile removes them when safe."
        required: false
        default: "quick"
        type: choice
        options:
          - quick
          - reconcile
  push:
    branches:
      - main
    paths:
      - scripts/sync-sheet-cache.mjs
      - .github/workflows/sync-sheet-cache.yml
      - market-date-sort-fix.js
  schedule:
    - cron: "*/5 * * * *"
    - cron: "10 18 * * *"

permissions:
  contents: write

concurrency:
  group: sync-sheet-cache
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static data cache
        run: |
          MODE="quick"
          EVENT_NAME="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "10 18 * * *" ]; then
            MODE="reconcile"
          fi
          echo "Sync mode: $MODE"
          node scripts/sync-sheet-cache.mjs --mode="$MODE"

      - name: Commit cache updates
        run: |
          if git diff --quiet -- data; then
            echo "No cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/projects.json data/meta.json
          git commit -m "Update sheet data cache"
          git push
