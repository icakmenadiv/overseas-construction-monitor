name: Sync view counts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-view-counts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Cloudflare view counts
        env:
          VIEW_COUNTS_API_URL: ${{ secrets.VIEW_COUNTS_API_URL }}
          VIEW_COUNTS_API_TOKEN: ${{ secrets.VIEW_COUNTS_API_TOKEN }}
        run: node scripts/sync-view-counts.mjs

      - name: Commit view-count cache updates
        run: |
          if git diff --quiet -- data/view-counts.json; then
            echo "No view-count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/view-counts.json
          git commit -m "Update view count cache"
          git push
