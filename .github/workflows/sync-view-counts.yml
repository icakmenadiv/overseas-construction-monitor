name: Sync view counts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/view-count-sync-trigger.txt"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-view-counts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Fetch Cloudflare view counts
        env:
          VIEW_COUNTS_API_URL: ${{ secrets.VIEW_COUNTS_API_URL }}
          VIEW_COUNTS_API_TOKEN: ${{ secrets.VIEW_COUNTS_API_TOKEN }}
        run: node scripts/sync-view-counts.mjs

      - name: Commit view-count cache updates
        run: |
          if git diff --quiet -- data/view-counts.json; then
            echo "No view-count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/view-counts.json
          git commit -m "Update view count cache"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
