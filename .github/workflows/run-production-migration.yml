name: Run production asset migration

on:
  push:
    branches:
      - refactor/asset-structure-20260903
    paths:
      - "scripts/migrate-production-assets.mjs"
      - ".github/workflows/run-production-migration.yml"

permissions:
  contents: write

concurrency:
  group: production-asset-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v6
        with:
          ref: refactor/asset-structure-20260903
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build integrated production assets
        run: node scripts/migrate-production-assets.mjs

      - name: Preserve workflow and migration sources
        run: |
          git restore --source=HEAD -- .github/workflows scripts/migrate-production-assets.mjs

      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git commit -m "Integrate production page assets and refresh UI"
          git push origin HEAD:refactor/asset-structure-20260903
