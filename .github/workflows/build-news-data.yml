name: Build news data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static news JSON
        env:
          NEWS_CSV_URL: ${{ secrets.NEWS_CSV_URL }}
        run: python scripts/build_news_data.py

      - name: Commit generated data
        run: |
          if [ -n "$(git status --porcelain data/public)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/public
            git commit -m "Build news data"
            git push
          else
            echo "No generated news data changes."
          fi
