<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로젝트 상세 | Preview</title>
    <meta name="description" content="프로젝트별 관련 기사 상세 시안 페이지" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./monitor-ui.css" />
    <link rel="stylesheet" href="./large-text.css" />
    <link rel="stylesheet" href="./brand-enhancements.css" />
    <link rel="stylesheet" href="./interest.css" />
    <link rel="stylesheet" href="./monitor-enhancements.css?v=20260615-4" />
    <link rel="stylesheet" href="./responsive-mobile-cards.css?v=20260619-1" />
    <link rel="stylesheet" href="./preview-redesign.css?v=20260622-1" />
  </head>
  <body class="preview-redesign project-detail-preview">
    <header class="site-header" id="top">
      <div class="brand-wrap">
        <a class="brand" href="https://www.icak.or.kr/" target="_blank" rel="noreferrer">
          <img src="https://www.icak.or.kr/file/icak_ci.jpg" alt="ICAK CI" class="brand-logo" />
          <span class="brand-fallback" aria-hidden="true">ICAK</span>
        </a>
        <div>
          <p class="eyebrow">Preview</p>
          <h1>프로젝트 상세</h1>
          <div class="preview-info-wrap">
            <button type="button" class="preview-info-button" aria-expanded="false" aria-controls="projectPreviewInfo">서비스 안내</button>
            <p class="preview-info-box" id="projectPreviewInfo" hidden>
              프로젝트별로 누적 수집된 관련 기사를 연결해 사업 단계, 최근 업데이트, 주요 이슈를 확인할 수 있습니다. 기사와 사업 정보는 시장 뉴스 기반으로 정리되며 원문 확인이 필요합니다.
            </p>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <nav class="page-nav" aria-label="모니터링 페이지 이동">
          <a href="./market-preview.html">해외 건설시장 뉴스</a>
          <a class="is-active" href="./projects-preview.html">프로젝트 목록</a>
        </nav>
        <p class="sync-status" id="syncStatus">데이터 연결 대기 중</p>
      </div>
    </header>

    <main class="dashboard">
      <section class="project-section" aria-label="프로젝트 상세 정보">
        <div class="project-toolbar">
          <div class="project-title-block">
            <h2 id="projectTitle">프로젝트를 불러오는 중입니다</h2>
            <p id="projectSubtitle">관련 기사와 최신 진행 단계를 확인합니다.</p>
          </div>
          <a class="project-back-link" href="./projects-preview.html">프로젝트 목록으로 돌아가기</a>
        </div>
        <div class="state-box" id="loadingState">데이터를 불러오는 중입니다.</div>
        <div class="state-box is-error" id="errorState" hidden>프로젝트 정보를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>
        <div class="state-box" id="emptyState" hidden>조건에 맞는 프로젝트 기사가 없습니다.</div>
        <div id="projectContent" hidden>
          <div class="project-meta-grid" id="projectMetaGrid"></div>
          <div class="project-articles" id="projectArticles"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="footer-icak-logo" href="https://www.icak.or.kr/" target="_blank" rel="noreferrer"><img src="https://www.icak.or.kr/file/icak_ci.jpg" alt="해외건설협회" />해외건설협회</a>
      <button type="button" class="back-to-top" id="backToTopButton">상단으로 가기</button>
    </footer>

    <script>document.addEventListener('click',function(e){const b=e.target.closest('.preview-info-button');if(!b)return;const box=document.getElementById(b.getAttribute('aria-controls'));const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));if(box)box.hidden=open;});function keepPreviewDetailLinks(){document.querySelectorAll('a[href^="./projects.html"]').forEach(a=>{a.href=a.href.replace('projects.html','projects-preview.html');});}new MutationObserver(keepPreviewDetailLinks).observe(document.body,{childList:true,subtree:true});setInterval(keepPreviewDetailLinks,700);</script>
    <script src="./project-detail-loader-fix.js?v=20260615-3"></script>
    <script src="./project.js?v=20260615-4"></script>
    <script src="./project-date-dedupe.js?v=20260615-1"></script>
    <script src="./interest-config.js"></script>
    <script src="./interest.js?v=20260618-safe-1"></script>
    <script src="./interest-behavior-fix.js?v=20260619-1"></script>
  </body>
</html>
